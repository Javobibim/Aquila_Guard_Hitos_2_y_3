services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: aquila
      POSTGRES_DB: aquila_guard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aquila_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquila -d aquila_guard"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  aquila_db:
