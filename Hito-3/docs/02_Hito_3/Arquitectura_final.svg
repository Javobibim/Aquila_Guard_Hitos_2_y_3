<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600"><rect width="1280" height="600" fill="white"/><g font-family="Arial" fill="#102747"><text x="30" y="45" font-size="30" font-weight="bold">Arquitectura implementada de Aquila Guard</text><text x="30" y="108" font-size="24" font-weight="bold">Panel académico con API propia y SQL local</text><g font-size="21" text-anchor="middle"><g fill="#eef4fa" stroke="#8da9c3"><rect x="30" y="135" width="230" height="85"/><rect x="345" y="135" width="240" height="85"/><rect x="670" y="135" width="240" height="85"/><rect x="995" y="135" width="250" height="85"/></g><text x="145" y="172">Interfaz del usuario</text><text x="145" y="199">HTML y JavaScript</text><text x="465" y="172">API Express</text><text x="465" y="199">Rutas y controladores</text><text x="790" y="172">Servicios y motor</text><text x="790" y="199">Validación y reglas</text><text x="1120" y="172">Repositorio SQL</text><text x="1120" y="199">PGlite en disco</text></g><text x="30" y="275" font-size="21">La petición guarda un resumen y la respuesta vuelve a la interfaz. La base conserva el dato al reiniciar.</text><text x="30" y="350" font-size="24" font-weight="bold">Portal público con análisis local y resúmenes por cuenta</text><g font-size="21" text-anchor="middle"><g fill="#eef4fa" stroke="#8da9c3"><rect x="30" y="375" width="340" height="90"/><rect x="470" y="375" width="340" height="90"/><rect x="910" y="375" width="335" height="90"/></g><text x="200" y="412">Web y motor compartido</text><text x="200" y="441">Revisión en el dispositivo</text><text x="640" y="412">Authentication y Cloud</text><text x="640" y="441">Identidad y operaciones</text><text x="1077" y="412">Firestore y reglas</text><text x="1077" y="441">Historial del propietario</text></g><text x="30" y="520" font-size="21">Extensión y Android agregan avisos según permisos y datos observables. Android conserva historial local.</text><text x="30" y="565" font-size="20">Los almacenes SQL y Firestore son independientes. Fecha de revisión 21 de noviembre de 2026.</text></g><g stroke="#526c87" stroke-width="2"><path d="M260 170h85m0 20h-85M585 170h85m0 20h-85M910 170h85m0 20h-85M370 411h100m0 22h-100M810 411h100m0 22h-100"/></g></svg>
